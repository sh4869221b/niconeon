name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
      package:
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  linux-sdk:
    name: linux-qt-6.12-sdk
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 90
    steps:
      - name: Install Qt source-build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential pkgconf curl patch xz-utils unzip python3 perl \
            libgl-dev libegl-dev libopengl-dev libvulkan-dev libx11-dev libx11-xcb-dev \
            libxext-dev libxfixes-dev libxi-dev libxrender-dev libxcb1-dev libxcb-cursor-dev \
            libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-xkb-dev libxcb-util-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev \
            libharfbuzz-dev libssl-dev libsqlite3-dev libdbus-1-dev libglib2.0-dev \
            libicu-dev libpng-dev libjpeg-dev libpcre2-dev zlib1g-dev libzstd-dev libb2-dev \
            libwayland-dev wayland-protocols
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Restore matching Linux SDK
        id: sdk-cache
        uses: actions/cache@v6.1.0
        with:
          path: /opt/niconeon-sdk
          key: linux-trixie-x86_64-sdk-v1-${{ hashFiles('scripts/deps/build_qt.sh', 'scripts/deps/qt-sources.sha256', 'scripts/deps/install_build_tools.sh') }}
      - name: Install verified current build tools
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          scripts/deps/install_build_tools.sh /opt/niconeon-sdk/tools
          echo /opt/niconeon-sdk/tools/bin >> "$GITHUB_PATH"
      - name: Build Qt 6.12.0 with official security fixes
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: scripts/deps/build_qt.sh /opt/niconeon-sdk/qt
      - name: Verify SDK source and runtime identity
        run: |
          cd /opt/niconeon-sdk/qt/share/niconeon/qt-source
          sha256sum --check qt-sources.sha256
          cd /opt/niconeon-sdk/qt
          sha256sum --check share/niconeon/qt-source/runtime.sha256
          test "$(bin/qmake -query QT_VERSION)" = 6.12.0
      - name: Archive tested SDK inputs
        run: |
          mkdir -p build
          tar -I 'gzip -1' -cf build/niconeon-linux-sdk.tar.gz -C /opt niconeon-sdk
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-qt-sdk
          path: build/niconeon-linux-sdk.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux-media-sdk:
    needs: linux-sdk
    name: linux-media-sdk
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 90
    steps:
      - name: Install the matching Debian media build dependencies
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get build-dep -y --no-install-recommends ffmpeg
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential pkgconf python3 curl patch xz-utils unzip \
            ffmpeg glslc libmpv-dev python3-glad python3-jinja2 libfast-float-dev \
            libvulkan-dev libshaderc-dev liblcms2-dev autoconf automake libtool nasm \
            libfreetype-dev libfontconfig1-dev libfribidi-dev libharfbuzz-dev libunibreak-dev
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: linux-qt-sdk
          path: build/sdk
      - name: Select verified current build tools
        run: |
          tar -xzf build/sdk/niconeon-linux-sdk.tar.gz -C /opt
          echo /opt/niconeon-sdk/tools/bin >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=/opt/niconeon-media/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/niconeon-media/lib" >> "$GITHUB_ENV"
      - name: Restore matching media SDK
        id: media-cache
        uses: actions/cache@v6.1.0
        with:
          path: /opt/niconeon-media
          key: linux-trixie-x86_64-media-v1-${{ hashFiles('scripts/deps/build_media_support.sh', 'scripts/deps/media-support-sources.sha256', 'scripts/deps/build_libplacebo.sh', 'scripts/deps/build_ffmpeg.sh', 'scripts/deps/ffmpeg-sources.sha256', 'scripts/deps/build_mpv.sh', 'scripts/deps/mpv-static-libplacebo.patch', 'scripts/deps/install_build_tools.sh') }}
      - name: Build the current media stack with audited feature changes
        if: steps.media-cache.outputs.cache-hit != 'true'
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          scripts/deps/build_media_support.sh /opt/niconeon-media
          scripts/deps/build_libplacebo.sh /opt/niconeon-media
          scripts/deps/build_ffmpeg.sh /opt/niconeon-media
          scripts/deps/build_mpv.sh /opt/niconeon-media
      - name: Verify retained media sources and runtimes
        env:
          NICONEON_MPV_SOURCE_DIR: /opt/niconeon-media/share/niconeon/libmpv-source
        run: |
          scripts/release/verify_mpv_runtime.sh /opt/niconeon-media/lib/libmpv.so.2
          scripts/release/copy_mpv_source.sh /tmp/media-source-verification
          scripts/release/copy_libplacebo_source.sh /tmp/media-source-verification /opt/niconeon-media/lib/libplacebo.a
          scripts/release/copy_ffmpeg_source.sh /tmp/media-source-verification /opt/niconeon-media
          scripts/release/copy_media_support_source.sh /tmp/media-source-verification /opt/niconeon-media
          rm -rf /tmp/media-source-verification
      - name: Archive verified media SDK
        run: |
          tar -I 'gzip -1' -cf build/niconeon-linux-media.tar.gz -C /opt niconeon-media
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-media-sdk
          path: build/niconeon-linux-media.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux:
    needs: [linux-sdk, linux-media-sdk]
    name: linux-${{ matrix.preset }}
    runs-on: ubuntu-latest
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan-ubsan]
    steps:
      - name: Install media and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git g++ cmake ninja-build pkgconf python3 meson curl patch \
            python3-glad python3-jinja2 libfast-float-dev libvulkan-dev libshaderc-dev liblcms2-dev \
            ffmpeg libmpv-dev libgl-dev libegl-dev libopengl-dev libxkbcommon-dev libxcb-cursor0 libxkbcommon-x11-0 libx11-xcb1 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 \
            fonts-dejavu-core fonts-noto-cjk xvfb xauth dbus-daemon libgl1-mesa-dri libegl-mesa0 libglx-mesa0 \
            zip unzip curl file patchelf desktop-file-utils \
            libb2-1 libicu76 libpcre2-16-0 libglib2.0-0t64 libdbus-1-3 libfontconfig1 \
            libharfbuzz0b libfreetype6 libpng16-16t64 libjpeg62-turbo libzstd1 \
            libssl3t64 libsqlite3-0 libwayland-client0 libwayland-cursor0 libwayland-egl1
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: linux-qt-sdk
          path: build/sdk
      - name: Select verified Qt 6.12 SDK
        run: |
          tar -xzf build/sdk/niconeon-linux-sdk.tar.gz -C /opt
          echo /opt/niconeon-sdk/tools/bin >> "$GITHUB_PATH"
          echo /opt/niconeon-sdk/qt/bin >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=/opt/niconeon-sdk/qt" >> "$GITHUB_ENV"
          echo "QT_ROOT_DIR=/opt/niconeon-sdk/qt" >> "$GITHUB_ENV"
          echo "QMAKE=/opt/niconeon-sdk/qt/bin/qmake" >> "$GITHUB_ENV"
          echo "NICONEON_QT_SOURCE_DIR=/opt/niconeon-sdk/qt/share/niconeon/qt-source" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/lib:/opt/niconeon-sdk/qt/lib" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: linux-media-sdk
          path: build/media-sdk
      - name: Select verified media SDK
        run: |
          tar -xzf build/media-sdk/niconeon-linux-media.tar.gz -C /opt
          echo "PKG_CONFIG_PATH=/opt/niconeon-media/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/niconeon-media/lib:/opt/niconeon-sdk/qt/lib" >> "$GITHUB_ENV"
          echo "NICONEON_MPV_SOURCE_DIR=/opt/niconeon-media/share/niconeon/libmpv-source" >> "$GITHUB_ENV"
          echo "NICONEON_LIBPLACEBO_SOURCE_DIR=/opt/niconeon-media/share/niconeon/libplacebo-source" >> "$GITHUB_ENV"
          echo "NICONEON_MEDIA_PREFIX=/opt/niconeon-media" >> "$GITHUB_ENV"
      - name: Check SDK runtime dependencies
        run: |
          ldd /opt/niconeon-media/lib/*.so* /opt/niconeon-media/bin/ffmpeg \
            /opt/niconeon-sdk/qt/lib/libQt6Core.so.6 \
            /opt/niconeon-sdk/qt/lib/libQt6Quick.so.6 \
            /opt/niconeon-sdk/qt/libexec/moc \
            /opt/niconeon-sdk/qt/libexec/qmlimportscanner > /tmp/qt-runtime-dependencies.txt
          cat /tmp/qt-runtime-dependencies.txt
          if grep -q 'not found' /tmp/qt-runtime-dependencies.txt; then exit 1; fi
      - name: Verify native license notices
        run: |
          scripts/release/generate_third_party_notices.sh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code -- THIRD_PARTY_NOTICES.txt
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DNICONEON_BUILD_UI_E2E=ON
      - name: Build
        id: build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Unit and QML tests
        run: ctest --preset ${{ matrix.preset }} -LE opengl --output-junit tests.xml
      - name: Strict OpenGL integration with default scaling
        env:
          NICONEON_MPV_SCALE: default
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x1024x24 -ac' ctest --preset ${{ matrix.preset }} -L opengl --output-junit opengl-default.xml
      - name: Strict OpenGL integration with explicit bilinear compatibility scaling
        if: ${{ !cancelled() && (success() || failure()) && steps.build.outcome == 'success' }}
        env:
          NICONEON_MPV_SCALE: bilinear
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x1024x24 -ac' ctest --preset ${{ matrix.preset }} -L opengl --output-junit opengl-bilinear.xml
      - name: Package single Linux executable
        if: ${{ !cancelled() && (success() || failure()) && steps.build.outcome == 'success' && matrix.preset == 'release' }}
        env:
          NICONEON_RELEASE_BASENAME: niconeon-linux-x86_64
        run: |
          scripts/release/package_linux.sh ci
          scripts/release/verify_binary_artifact_licenses.sh dist/niconeon-linux-x86_64-binaries.zip
          scripts/release/package_linux_appimage.sh ci
          scripts/release/verify_binary_artifact_licenses.sh dist/niconeon-linux-x86_64.AppImage
          # A source SDK left on disk must not hide a missing bundled dependency.
          (
            mv /opt/niconeon-sdk /opt/niconeon-sdk-hidden
            trap 'mv /opt/niconeon-sdk-hidden /opt/niconeon-sdk; if [ -d /opt/niconeon-media-hidden ]; then mv /opt/niconeon-media-hidden /opt/niconeon-media; fi' EXIT
            mv /opt/niconeon-media /opt/niconeon-media-hidden
            env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH -u QML_IMPORT_PATH -u QML2_IMPORT_PATH \
              timeout 30s xvfb-run -a -s '-screen 0 1280x1024x24 -ac' env \
              APPIMAGE_EXTRACT_AND_RUN=1 NICONEON_AUTO_EXIT_MS=1500 LIBGL_ALWAYS_SOFTWARE=1 \
              dist/niconeon-linux-x86_64.AppImage
          )
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results-linux-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/tests.xml
            build/${{ matrix.preset }}/opengl-default.xml
            build/${{ matrix.preset }}/opengl-bilinear.xml
            build/${{ matrix.preset }}/Testing/Temporary/
            build/${{ matrix.preset }}/rendernode-alignment-failure.png
            build/${{ matrix.preset }}/video-overlay-*.png
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && (success() || failure()) && matrix.preset == 'release' && hashFiles('dist/niconeon-linux-x86_64-binaries.zip') != '' }}
        with:
          name: release-linux-binaries
          path: dist/niconeon-linux-x86_64-binaries.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && (success() || failure()) && matrix.preset == 'release' && hashFiles('dist/niconeon-linux-x86_64.AppImage') != '' }}
        with:
          name: release-linux-appimage
          path: dist/niconeon-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

  static-analysis:
    needs: [linux-sdk, linux-media-sdk]
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git g++ cmake ninja-build pkgconf \
            ffmpeg libmpv-dev libgl-dev libegl-dev libopengl-dev \
            libb2-1 libicu76 libpcre2-16-0 libglib2.0-0t64 libdbus-1-3 libfontconfig1 \
            libharfbuzz0b libfreetype6 libpng16-16t64 libjpeg62-turbo libzstd1 \
            libssl3t64 libsqlite3-0 libwayland-client0 libwayland-cursor0 libwayland-egl1
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: linux-qt-sdk
          path: build/sdk
      - name: Select verified Qt 6.12 SDK
        run: |
          tar -xzf build/sdk/niconeon-linux-sdk.tar.gz -C /opt
          echo /opt/niconeon-sdk/tools/bin >> "$GITHUB_PATH"
          echo /opt/niconeon-sdk/qt/bin >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=/opt/niconeon-sdk/qt" >> "$GITHUB_ENV"
          echo "QT_ROOT_DIR=/opt/niconeon-sdk/qt" >> "$GITHUB_ENV"
          echo "QMAKE=/opt/niconeon-sdk/qt/bin/qmake" >> "$GITHUB_ENV"
          echo "NICONEON_QT_SOURCE_DIR=/opt/niconeon-sdk/qt/share/niconeon/qt-source" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/lib:/opt/niconeon-sdk/qt/lib" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: linux-media-sdk
          path: build/media-sdk
      - name: Select verified media SDK
        run: |
          tar -xzf build/media-sdk/niconeon-linux-media.tar.gz -C /opt
          echo "PKG_CONFIG_PATH=/opt/niconeon-media/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/niconeon-media/lib:/opt/niconeon-sdk/qt/lib" >> "$GITHUB_ENV"
          echo "NICONEON_MPV_SOURCE_DIR=/opt/niconeon-media/share/niconeon/libmpv-source" >> "$GITHUB_ENV"
          echo "NICONEON_LIBPLACEBO_SOURCE_DIR=/opt/niconeon-media/share/niconeon/libplacebo-source" >> "$GITHUB_ENV"
          echo "NICONEON_MEDIA_PREFIX=/opt/niconeon-media" >> "$GITHUB_ENV"
      - name: Check SDK runtime dependencies
        run: |
          ldd /opt/niconeon-media/lib/*.so* /opt/niconeon-media/bin/ffmpeg \
            /opt/niconeon-sdk/qt/lib/libQt6Core.so.6 \
            /opt/niconeon-sdk/qt/lib/libQt6Quick.so.6 \
            /opt/niconeon-sdk/qt/libexec/moc \
            /opt/niconeon-sdk/qt/libexec/qmlimportscanner > /tmp/qt-runtime-dependencies.txt
          cat /tmp/qt-runtime-dependencies.txt
          if grep -q 'not found' /tmp/qt-runtime-dependencies.txt; then exit 1; fi
      - name: Configure static analysis
        run: cmake --preset tidy
      - name: Check C++ formatting
        run: cmake --build build/tidy --target format-check
      - name: Analyze project compilation
        run: cmake --build --preset tidy --parallel 2

  windows-ucrt64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-mesa
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-dbus
            mingw-w64-ucrt-x86_64-double-conversion
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-icu
            mingw-w64-ucrt-x86_64-libb2
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-md4c
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-pcre2
            mingw-w64-ucrt-x86_64-sqlite
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-xmlstarlet
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-firebird
            mingw-w64-ucrt-x86_64-libmariadbclient
            mingw-w64-ucrt-x86_64-postgresql
            base-devel rsync python zip unzip patch curl
      - name: Test Windows Qt source verification in MSYS
        shell: msys2 {0}
        run: /usr/bin/python3 tests/packaging/windows_qt_source_test.py
      - name: Fingerprint the Qt build environment
        id: qt-build-env
        shell: msys2 {0}
        run: |
          inventory=$(pacman -Q | LC_ALL=C sort | sha256sum | cut -d' ' -f1)
          echo "inventory=$inventory" >> "$GITHUB_OUTPUT"
      - name: Restore verified Windows Qt build inputs
        id: windows-qt-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            C:/nqt/packages
            C:/nqt/source
            C:/nqt/packages.sha256
            C:/nqt/complete
          key: windows-ucrt64-qt-v1-${{ steps.qt-build-env.outputs.inventory }}-${{ hashFiles('scripts/deps/build_windows_qt.sh', 'scripts/deps/windows-qt-recipe.sha256', 'scripts/deps/qt-sources.sha256') }}
      - name: Build and install QtBase with official security fixes
        shell: msys2 {0}
        env:
          NICONEON_WINDOWS_QT_WORK_DIR: /c/nqt
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
          MAKEFLAGS: '-j2'
        run: scripts/deps/build_windows_qt.sh
      - name: Save verified Windows Qt package cache
        if: steps.windows-qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            C:/nqt/packages
            C:/nqt/source
            C:/nqt/packages.sha256
            C:/nqt/complete
          key: windows-ucrt64-qt-v1-${{ steps.qt-build-env.outputs.inventory }}-${{ hashFiles('scripts/deps/build_windows_qt.sh', 'scripts/deps/windows-qt-recipe.sha256', 'scripts/deps/qt-sources.sha256') }}
      - name: Build libmpv 0.42.0 (includes upstream scaler fix)
        shell: msys2 {0}
        run: scripts/deps/build_mpv.sh /ucrt64
      - name: Build and test single C++23 application
        shell: msys2 {0}
        run: |
          cmake --preset windows-release
          cmake --build --preset windows-release --parallel 2
          ctest --preset windows-release --output-junit tests.xml
      - name: Package Windows application and native dependencies
        shell: msys2 {0}
        env:
          NICONEON_RELEASE_BASENAME: niconeon-windows-x86_64
          NICONEON_BUILD_DIR: build/windows-release
          NICONEON_MPV_SOURCE_DIR: /ucrt64/share/niconeon/libmpv-source
        run: |
          scripts/release/package_windows_msys2.sh ci
          scripts/release/verify_binary_artifact_licenses.sh dist/niconeon-windows-x86_64-binaries.zip
          unzip -Z1 dist/niconeon-windows-x86_64-binaries.zip | grep -E '/qt\.conf$'
          unzip -Z1 dist/niconeon-windows-x86_64-binaries.zip | grep -E '/sqldrivers/qsqlite\.dll$'
      - name: Diagnose clean Windows bundle startup
        shell: pwsh
        run: scripts/release/verify_windows_startup.ps1 -Archive dist/niconeon-windows-x86_64-binaries.zip
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results-windows-ucrt64
          path: |
            build/windows-release/tests.xml
            build/windows-release/Testing/Temporary/
            dist/windows-runtime-smoke.log
            dist/niconeon-windows-x86_64-dependency-report.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always() && hashFiles('dist/niconeon-windows-x86_64-binaries.zip') != ''
        with:
          name: release-windows-binaries
          path: dist/niconeon-windows-x86_64-binaries.zip
          if-no-files-found: error
          retention-days: 14
