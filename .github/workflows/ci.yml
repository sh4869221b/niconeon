name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  license-check:
    name: license-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-license
        run: cargo install --locked cargo-license

      - name: Verify third-party notices are up to date
        run: |
          scripts/release/generate_third_party_notices.sh
          git diff --exit-code -- THIRD_PARTY_NOTICES.txt

      - name: Verify required license metadata files
        run: |
          test -f LICENSE
          test -f COPYING
          test -f SOURCE_CODE.md

  core-test:
    name: core-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Run core tests
        run: bazelisk test //core/...

  ui-build-linux:
    name: ui-build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libmpv-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-declarative-dev-tools

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Build UI (Linux)
        run: bazelisk build //app-ui:niconeon-ui

      - name: Install Linux release packaging dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sudo apt-get install -y --no-install-recommends \
            zip \
            patchelf \
            desktop-file-utils

      - name: Build release binaries with Bazel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bazelisk build --config=release //core:niconeon-core //app-ui:niconeon-ui

      - name: Stage Bazel release binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p dist/bazel-linux-ui dist/bazel-linux-core
          ui_bin="$(bazelisk cquery --config=release --output=files //app-ui:niconeon-ui | grep -E '(^|/)niconeon-ui$' | tail -n1)"
          core_bin="$(bazelisk cquery --config=release --output=files //core:niconeon-core | grep -E '(^|/)niconeon-core$' | tail -n1)"
          test -n "${ui_bin}"
          test -n "${core_bin}"
          cp "${ui_bin}" dist/bazel-linux-ui/niconeon-ui
          cp "${core_bin}" dist/bazel-linux-core/niconeon-core
          chmod 755 dist/bazel-linux-ui/niconeon-ui dist/bazel-linux-core/niconeon-core

      - name: Package Linux binaries zip
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NICONEON_UI_BUILD_DIR: dist/bazel-linux-ui
          NICONEON_CORE_BUILD_DIR: dist/bazel-linux-core
          NICONEON_RELEASE_BASENAME: niconeon-linux-x86_64
        run: scripts/release/package_linux.sh ci

      - name: Verify Linux binaries license bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: scripts/release/verify_binary_artifact_licenses.sh dist/niconeon-linux-x86_64-binaries.zip

      - name: Package Linux AppImage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NICONEON_UI_BUILD_DIR: dist/bazel-linux-ui
          NICONEON_CORE_BUILD_DIR: dist/bazel-linux-core
          NICONEON_RELEASE_BASENAME: niconeon-linux-x86_64
        run: scripts/release/package_linux_appimage.sh ci

      - name: Verify Linux AppImage license bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: scripts/release/verify_binary_artifact_licenses.sh dist/niconeon-linux-x86_64.AppImage

      - name: Upload Linux binaries artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-binaries
          path: dist/niconeon-linux-x86_64-binaries.zip
          retention-days: 14

      - name: Upload Linux AppImage artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-appimage
          path: dist/niconeon-linux-x86_64.AppImage
          retention-days: 14

  ui-unit-linux:
    name: ui-unit-linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux UI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libmpv-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-declarative-dev-tools

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Run UI unit tests (Linux)
        run: bazelisk test //app-ui:ui_unit_tests

  ui-e2e-linux-best-effort:
    name: ui-e2e-linux-best-effort
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux UI/E2E dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libmpv-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qml6-module-qtqml-workerscript \
            xvfb

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Run UI E2E (Linux, best effort)
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24 -ac" env \
            LIBGL_ALWAYS_SOFTWARE=1 \
            MESA_LOADER_DRIVER_OVERRIDE=llvmpipe \
            NICONEON_DANMAKU_RENDERER=frame_image \
            bazelisk test \
              --test_output=errors \
              --test_env=DISPLAY \
              --test_env=LIBGL_ALWAYS_SOFTWARE \
              --test_env=MESA_LOADER_DRIVER_OVERRIDE \
              --test_env=NICONEON_DANMAKU_RENDERER \
              //app-ui:rendernode_alignment_e2e

  ui-build-windows:
    name: ui-build-windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Export Bazelisk path for MSYS2
        shell: pwsh
        run: |
          $bazelisk = Join-Path $env:RUNNER_TEMP "bazelisk.exe"
          Invoke-WebRequest -Uri "https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-windows-amd64.exe" -OutFile $bazelisk
          "BAZELISK_WINDOWS_PATH=$bazelisk" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup MSYS2 (Qt6 + mpv)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          cache: true
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-mpv
            unzip
            zip

      - name: Build and stage UI (Windows, MSYS2)
        shell: msys2 {0}
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          set -euo pipefail
          export PATH="/mingw64/bin:/usr/bin:${PATH}"
          export BAZEL_SH="$(cygpath -m /usr/bin/bash.exe)"
          bazelisk_cmd="$(cygpath -u "${BAZELISK_WINDOWS_PATH}")"
          echo "MSYS2_ARG_CONV_EXCL=${MSYS2_ARG_CONV_EXCL}"
          echo "BAZEL_SH=${BAZEL_SH}"
          "${bazelisk_cmd}" aquery --config=windows_mingw --config=release 'mnemonic("CppCompile", //app-ui:niconeon-ui)' --include_commandline |
            tools/bazel/verify_mingw_aquery.sh
          "${bazelisk_cmd}" build --config=windows_mingw --config=release //app-ui:niconeon-ui
          mkdir -p dist/bazel-windows-ui
          ui_bin="$("${bazelisk_cmd}" cquery --config=windows_mingw --config=release --output=files //app-ui:niconeon-ui | grep -E '(^|/)niconeon-ui\.exe$' | tail -n1)"
          test -n "${ui_bin}"
          cp "${ui_bin}" dist/bazel-windows-ui/niconeon-ui.exe

      - name: Setup Rust
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: dtolnay/rust-toolchain@stable

      - name: Build and stage core (release, MSVC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          bazelisk build --config=release //core:niconeon-core
          $coreBin = bazelisk cquery --config=release --output=files //core:niconeon-core |
            Where-Object { $_ -match '(^|/|\\)niconeon-core\.exe$' } |
            Select-Object -Last 1
          if (-not $coreBin) {
            throw "Bazel core binary output was not found"
          }
          New-Item -ItemType Directory -Force dist\bazel-windows-core | Out-Null
          Copy-Item $coreBin dist\bazel-windows-core\niconeon-core.exe -Force

      - name: Package Windows binaries zip
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: msys2 {0}
        env:
          MSYS2_ARG_CONV_EXCL: "*"
          NICONEON_UI_BUILD_DIR: dist/bazel-windows-ui
          NICONEON_CORE_BUILD_DIR: dist/bazel-windows-core
          NICONEON_RELEASE_BASENAME: niconeon-windows-x86_64
        run: scripts/release/package_windows_msys2.sh ci

      - name: Verify Windows binaries license bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: msys2 {0}
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: scripts/release/verify_binary_artifact_licenses.sh dist/niconeon-windows-x86_64-binaries.zip

      - name: Verify Windows bundle includes qt.conf
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: msys2 {0}
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: unzip -Z1 dist/niconeon-windows-x86_64-binaries.zip | grep -E '/qt\.conf$'

      - name: Upload Windows binaries artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-binaries
          path: dist/niconeon-windows-x86_64-binaries.zip
          retention-days: 14
