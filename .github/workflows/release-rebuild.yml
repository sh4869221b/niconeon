name: Release Rebuild
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build/test/package as workflow artifacts only (vX.Y.Z)
        type: string
        required: true
concurrency:
  group: release-rebuild-${{ inputs.release_tag }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate immutable source tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
  rebuild:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ inputs.release_tag }}
      package: true
